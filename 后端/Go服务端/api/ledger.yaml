components:
  schemas:
    LedgerJournal:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        eventKey:
          type: string
        orderId:
          type: string
        customerId:
          type: string
        workerId:
          type: string
        settlementId:
          type: string
        actorId:
          type: string
        reason:
          type: string
        reversalOfId:
          type: string
        mode:
          type: string
          enum:
          - simulated
          - actual
        simulated:
          type: boolean
        kind:
          type: string
          enum:
          - collection
          - manual_payout
          - reversal
        channel:
          type: string
          enum:
          - demo
          - manual
          - wechat
          - alipay
          - aggregate
        status:
          type: string
          enum:
          - posted
          - reversed
        amountCents:
          type: integer
          minimum: 0
        workerShareCents:
          type: integer
          minimum: 0
        platformFeeCents:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/LedgerEntry"
      required:
      - id
      - eventKey
      - orderId
      - customerId
      - workerId
      - settlementId
      - actorId
      - reason
      - reversalOfId
      - mode
      - simulated
      - kind
      - channel
      - status
      - amountCents
      - workerShareCents
      - platformFeeCents
      - occurredAt
      - createdAt
      - entries
    LedgerEntry:
      type: object
      additionalProperties: false
      properties:
        account:
          type: string
          enum:
          - platform_funds
          - worker_payable
          - platform_revenue
        direction:
          type: string
          enum:
          - debit
          - credit
        amountCents:
          type: integer
          minimum: 1
          maximum: 100000000
      required:
      - account
      - direction
      - amountCents
    LedgerSummary:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - simulated
          - actual
        simulated:
          type: boolean
        currency:
          type: string
          const: CNY
        scope:
          type: string
          const: filtered_movements
        journalCount:
          type: integer
        collectedCents:
          type: integer
        workerAccruedCents:
          type: integer
        platformRevenueCents:
          type: integer
        payoutCents:
          type: integer
        platformFundsCents:
          type: integer
        workerPayableCents:
          type: integer
      required:
      - mode
      - simulated
      - currency
      - scope
      - journalCount
      - collectedCents
      - workerAccruedCents
      - platformRevenueCents
      - payoutCents
      - platformFundsCents
      - workerPayableCents
