---
paths:
  "/api/v1/admin/ledger/journals":
    get:
      operationId: adminLedgerJournals
      description: Requires a session administrator. Immutable balanced simulated
        journals; real mode is currently empty. No correction/write endpoint is exposed.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/LedgerJournal"
          headers:
            X-Next-Cursor:
              "$ref": "./openapi.yaml#/components/headers/NextCursor"
        '400':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '401':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '403':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '404':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '409':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '413':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '429':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '503':
          "$ref": "./openapi.yaml#/components/responses/Error"
        '504':
          "$ref": "./openapi.yaml#/components/responses/Error"
      parameters:
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - simulated
          - actual
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - collection
          - manual_payout
          - reversal
      - name: status
        in: query
        schema:
          type: string
          enum:
          - posted
          - reversed
      - name: channel
        in: query
        schema:
          type: string
          enum:
          - demo
          - manual
          - wechat
          - alipay
          - aggregate
      - name: orderId
        in: query
        schema:
          type: string
          maxLength: 64
      - name: customerId
        in: query
        schema:
          type: string
          maxLength: 64
      - name: workerId
        in: query
        schema:
          type: string
          maxLength: 64
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: 'Half-open range: from inclusive, to exclusive.'
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: 'Half-open range: from inclusive, to exclusive.'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
        description: Opaque X-Next-Cursor; keep identical filters.
  "/api/v1/admin/ledger/summary":
    get:
      operationId: adminLedgerSummary
      description: Requires a session administrator. Totals use all rows with the
