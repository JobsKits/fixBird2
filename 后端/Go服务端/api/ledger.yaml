  "/api/v1/admin/ledger/export.csv":
    get:
      operationId: exportAdminLedgerCSV
      description: Session admin only. UTF-8 BOM CSV, one row per debit/credit entry.
        Same filters as journals, no cursor. More than 10000 journals returns 413
        and never silently truncates. Spreadsheet formula text is escaped.
      responses:
        '200':
          description: Complete filtered journal entries.
          content:
            text/csv:
              schema:
                type: string
