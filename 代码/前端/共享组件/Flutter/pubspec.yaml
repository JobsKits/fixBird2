name: repair_shared
description: 啄木鸟维修平台 Flutter 共享业务与响应式界面。
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.6
  url_launcher: 6.3.2
  http: 1.6.0
  file_picker: 10.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/admin-ui.json
    - assets/ui-l10n.json
    - assets/RepairLogo.png
    - assets/NotoSansSC-OFL.txt
    - assets/NotoSerifTibetan-OFL.txt
    - assets/NotoSansCJK-OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/NotoSansSC.ttf
    - family: NotoSerifTibetan
      fonts:
        - asset: assets/NotoSerifTibetan.ttf
    - family: NotoSansCJK
      fonts:
        - asset: assets/NotoSansCJKsc-Regular.otf
